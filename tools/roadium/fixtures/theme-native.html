<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Roadium — native website theme test</title>
<style>
:root{color-scheme:light dark;--bg:#f4f1e8;--fg:#193e74;--card:#d4ebe8;--link:#193e74}
@media(prefers-color-scheme:dark){:root{--bg:#0d1b2a;--fg:#f4f1e8;--card:#172a40;--link:#76cecb}}
*{box-sizing:border-box}body{margin:0;padding:48px;font:24px/1.5 system-ui;background:var(--bg);color:var(--fg)}
main{max-width:980px;margin:auto}h1{font-size:44px;margin:0 0 16px}section{background:var(--card);padding:24px;border-radius:16px;margin-top:24px}a{color:var(--link)}
</style>
<main><h1>Roadium website themes</h1><p>This page supports the browser's preferred light or dark appearance.</p><section><strong id="scheme"></strong><p>Use Website theme in the browser menu to choose Light, Dark, or Follow system.</p><a href="/theme-light.html">Open the light-only test page</a></section></main>
<script>
const media=matchMedia('(prefers-color-scheme:dark)');
function update(){document.getElementById('scheme').textContent='Website preference: '+(media.matches?'Dark':'Light')}
media.addEventListener('change',update);update();
</script>
</html>
